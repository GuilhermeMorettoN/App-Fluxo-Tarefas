# Coordenador do atendimento (runtime github-actions). O backend cria a issue com a conta do dono
# e dispara workflow_dispatch; issues.opened também chega (issue criada por PAT, não pelo GITHUB_TOKEN).
# Execuções da mesma issue são serializadas; o estado no comentário de controle evita repetição.
name: ai-agents

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number: { description: "Número da issue", required: true, type: string }
      request_id: { description: "requestId do app (opcional)", required: false, type: string }
      retry: { description: "Retomar após erro/incerteza (pode fazer nova chamada paga)", type: boolean, default: false }

permissions: {}

concurrency:
  group: ai-agents-issue-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  coordenador:
    if: >-
      vars.AGENT_RUNTIME == 'github-actions' &&
      (github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name, 'origin:app'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Coordenador
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          REQUEST_ID: ${{ inputs.request_id }}
          RETRY: ${{ inputs.retry }}
          EXPECTED_AUTHOR: ${{ vars.APP_ISSUE_AUTHOR }}
          AGENT_DRY_RUN: ${{ vars.AGENT_DRY_RUN || 'true' }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          # Segredo só chega a este passo e só fora do dry-run.
          AI_API_KEY: ${{ vars.AGENT_DRY_RUN == 'false' && secrets.AI_API_KEY || '' }}
        run: node automacao/coordenador.mjs
      - name: Guardar resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coordenador-${{ github.run_id }}
          path: automacao-resultado/
          if-no-files-found: ignore
          retention-days: 14
